name: Build Android APK (Lite)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SPOTIFLAC_DISCORD_SDK: "0"
      SPOTIFLAC_RUST_ANDROID_ABIS: "arm64-v8a,armeabi-v7a"
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: "9.8.0"

      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;29.0.14206865" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Download and verify bundled extension packages
        run: python3 scripts/bundle_extensions.py

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Configure Flutter SDK for Gradle
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Build Rust-backed Android debug tasks
        run: gradle -p android :app:assembleDebug :app:testDebugUnitTest

      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Analyze and test Dart code
        run: |
          flutter analyze
          flutter test

      - name: Build release APKs without optional Discord SDK
        run: bash scripts/build_android.sh --lite --target lib/main.dart

      - name: Upload APKs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: spotiflac-mobile-bundled-extensions-apks-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
